# Fires a release on every push to main (conventional-commit-driven patch/minor/major
# bump), via KVG_Standards' reusable PyInstaller build. See KVG_Standards templates/auto-release.yml.
name: Auto Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.tag_version.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump semantic version and create tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          release_branches: main

  release:
    needs: version
    if: ${{ needs.version.outputs.new_tag != '' }}
    uses: gerp93/KVG_Standards/.github/workflows/release-python-gui.yml@main
    with:
      version: ${{ needs.version.outputs.new_tag }}
      app_name: SoSmartButNeverPunctual
      entry_point: punctual_gui.py
      windowed: true
      version_file: _version.py
      extra_add_data: 'assets:assets'
      icon_path: 'assets/icon'
    permissions:
      contents: write

  # Debian package (KVG_Standards deb-packaging.md): the same punctual.py, tag and release as the
  # desktop build above, with a smoke test that the installed command reports this tag's version.
  deb:
    needs: [version, release]
    if: ${{ needs.version.outputs.new_tag != '' }}
    uses: gerp93/KVG_Standards/.github/workflows/release-deb.yml@main
    with:
      version: ${{ needs.version.outputs.new_tag }}
      package_name: sosmartbutneverpunctual
      command_name: punctual
      entry_point: punctual.py
      install_files: punctual.py
      description: Keep Samsung appliance clocks in sync through SmartThings
      version_file: _version.py
    permissions:
      contents: write
